name: Sync & Purge Directories

on:
  push:
    branches: [ "master", "main" ]
    # 改工作流/README 不该触发一次全量同步。
    # 2026-08-12：给三条 rclone 补超时旗标时推了个纯 .github 改动，这里没这道闸门，
    # 于是照样跑了一次完整 CDN 同步 —— kr/gl 两个库早就有这两行，jp/sc/tc 漏了。
    paths-ignore:
      - ".github/**"
      - "README.md"
  workflow_dispatch:

jobs:
  deploy-and-purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cleanup Git Files
        run: rm -rf .git .github
      # ========================================================
      # 阶段 1: 存储桶同步 (Storage Sync)
      # ========================================================      
      - name: Install Rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          
          cd rclone-*-linux-amd64
          sudo cp rclone /usr/bin/
          sudo chown root:root /usr/bin/rclone
          sudo chmod 755 /usr/bin/rclone
          cd ..
          
          rm -rf rclone-*-linux-amd64* rclone-current-linux-amd64.zip
          rclone version
      - name: Minify JSON with orjson
        shell: bash
        run: |
          pip install orjson
          python -c "
          import os, orjson

          print('Starting fast minification with orjson...')
          count = 0
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith('.json'):
                      path = os.path.join(root, file)
                      try:
                          with open(path, 'rb') as f:
                              data = orjson.loads(f.read())
                          with open(path, 'wb') as f:
                              f.write(orjson.dumps(data))
                          count += 1
                      except Exception as e:
                          print(f'Error processing {path}: {e}')
          print(f'Processed {count} files.')
          "
      - name: Sync to Backblaze B2
        env:
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          rclone sync . b2:${{ secrets.B2_BUCKET_NAME }}/pjsk/sekai-db/cn \
            --verbose --transfers 32 --checkers 64 \
            --exclude ".git/**" --exclude ".github/**" \
            --contimeout 10s --timeout 120s --retries 2 --low-level-retries 3
            
      - name: Sync to R2
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          rclone sync . r2:${{ secrets.R2_BUCKET_NAME }}/pjsk/sekai-db/cn \
            --verbose \
            --transfers 32 \
            --checkers 64 \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --contimeout 10s --timeout 120s --retries 2 --low-level-retries 3

      - name: Sync to Tencent OSS
        env:
          RCLONE_CONFIG_TENCENT_TYPE: s3
          RCLONE_CONFIG_TENCENT_PROVIDER: TencentCOS
          RCLONE_CONFIG_TENCENT_ACCESS_KEY_ID: ${{ secrets.TENCENT_SECRET_ID }}
          RCLONE_CONFIG_TENCENT_SECRET_ACCESS_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          RCLONE_CONFIG_TENCENT_ENDPOINT: https://cos.${{ secrets.OSS_REGION }}.myqcloud.com
        run: |
          rclone sync . tencent:${{ secrets.OSS_BUCKET }}/sekai-db/cn \
            --verbose --transfers 32 --checkers 64 \
            --exclude ".git/**" --exclude ".github/**" \
            --contimeout 10s --timeout 120s --retries 2 --low-level-retries 3

      # ========================================================
      # 阶段 2: CDN 缓存清理 (Directory Purge)
      # ========================================================
     

      - name: Purge Cloudflare Prefix
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
        shell: python
        run: |
          import os, requests, json
          import sys
          bucket_name = os.environ["B2_BUCKET_NAME"]

          targets = [
            f"cdn.8823.eu.org/file/{bucket_name}/pjsk/sekai-db/cn/",
            "assets.resona.cn/sekai-db/cn/",
            "assets.8823.eu.org/sekai-db/cn/"
          ]

          zone_id = os.environ["CF_ZONE_ID"]
          token = os.environ["CF_API_TOKEN"]
          url = f"https://api.cloudflare.com/client/v4/zones/{zone_id}/purge_cache"
          
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }
          
          payload = { "prefixes": targets }
          
          # ⚠️ purge 失败必须红灯。master 正文在 CF 上是 max-age=2678400（31 天）、
          # last-modified 恒为 2000-01-01 哨兵（边缘无法条件回源）：这一步静默失败
          # 就等于整棵 sekai-db/<region>/ 停在旧版本最长 31 天，而工作流全程绿灯。
          # （前端那侧已经带上 ?v=data_version 兜住浏览器，但服务端读取方仍吃这一刀。）
          try:
              resp = requests.post(url, headers=headers, json=payload, timeout=30)
          except Exception as e:
              print(f"::error::CF purge 请求失败: {e}")
              sys.exit(1)
          print(f"Status: {resp.status_code}")
          print(resp.text)
          ok = False
          if resp.status_code == 200:
              try:
                  ok = bool(resp.json().get("success"))
              except Exception:
                  ok = False
          if not ok:
              print("::error::CF purge 未成功（HTTP 或 success 字段不对）——"
                    "CDN 会继续发旧 master，必须人工确认后重跑")
              sys.exit(1)

      - name: Purge Tencent EdgeOne
        env:
          TENCENT_EO_SECRET_ID: ${{ secrets.RESONACN_TENCENT_SECRET_ID }}
          TENCENT_EO_SECRET_KEY: ${{ secrets.RESONACN_TENCENT_SECRET_KEY }}
          TEO_ZONE_ID: ${{ secrets.TEO_ZONE_ID }}
        shell: python
        run: |
          # -*- coding: utf-8 -*-
          import hashlib, hmac, json, os, sys, time
          from datetime import datetime, timezone
          
          secret_id = os.environ.get("TENCENT_EO_SECRET_ID")
          secret_key = os.environ.get("TENCENT_EO_SECRET_KEY")
          zone_id = os.environ.get("TEO_ZONE_ID")

          service = "teo"
          host = "teo.tencentcloudapi.com"
          action = "CreatePurgeTask"
          version = "2022-09-01"
          algorithm = "TC3-HMAC-SHA256"
          timestamp = int(time.time())
          
          date = datetime.fromtimestamp(timestamp, timezone.utc).strftime("%Y-%m-%d")


          targets = [
              "https://assets.resona.cn/sekai-db/cn/"
          ]
          
          params = {
              "ZoneId": zone_id,
              "Type": "purge_prefix", 
              "Method": "delete",
              "Targets": targets
          }
          
          payload = json.dumps(params, separators=(',', ':'))


          http_request_method = "POST"
          canonical_uri = "/"
          canonical_querystring = ""
          ct = "application/json; charset=utf-8"
          canonical_headers = "content-type:%s\nhost:%s\n" % (ct, host)
          signed_headers = "content-type;host"
          hashed_request_payload = hashlib.sha256(payload.encode("utf-8")).hexdigest()
          canonical_request = (http_request_method + "\n" +
                               canonical_uri + "\n" +
                               canonical_querystring + "\n" +
                               canonical_headers + "\n" +
                               signed_headers + "\n" +
                               hashed_request_payload)

          credential_scope = date + "/" + service + "/" + "tc3_request"
          hashed_canonical_request = hashlib.sha256(canonical_request.encode("utf-8")).hexdigest()
          string_to_sign = (algorithm + "\n" +
                            str(timestamp) + "\n" +
                            credential_scope + "\n" +
                            hashed_canonical_request)

          def sign(key, msg):
              return hmac.new(key, msg.encode("utf-8"), hashlib.sha256).digest()
          
          secret_date = sign(("TC3" + secret_key).encode("utf-8"), date)
          secret_service = sign(secret_date, service)
          secret_signing = sign(secret_service, "tc3_request")
          signature = hmac.new(secret_signing, string_to_sign.encode("utf-8"), hashlib.sha256).hexdigest()


          authorization = (algorithm + " " +
                           "Credential=" + secret_id + "/" + credential_scope + ", " +
                           "SignedHeaders=" + signed_headers + ", " +
                           "Signature=" + signature)

          import requests
          
          headers = {
              "Authorization": authorization,
              "Content-Type": "application/json; charset=utf-8",
              "Host": host,
              "X-TC-Action": action,
              "X-TC-Timestamp": str(timestamp),
              "X-TC-Version": version
          }
          
          endpoint = "https://" + host
          
          print(f"Purging TEO Targets: {targets}")
          
          try:
              response = requests.post(endpoint, headers=headers, data=payload)
              
              print(f"Status Code: {response.status_code}")
              print(f"Response: {response.text}")
              
              if response.status_code != 200 or "Error" in response.text:
                  sys.exit(1)
                  
          except Exception as err:
              print(f"Request Failed: {err}")
              sys.exit(1)

  # ── 通知 sekai-asset-info 重生成衣装目录 ─────────────────────────────────
  # 治 2026-08-30 KR 赛跑：go 后端推包时**同时**给「资产索引同步」和「master 镜像」
  # 两个仓库发 dispatch。索引侧 1 分钟同步完就 workflow_call 进目录生成，而 master
  # 落 CDN 要 ~3 分钟——生成读到新索引 + 旧 master，新衣装在 master 里查无此人 →
  # 没进注入 → 产物 digest 与上一版相同被幂等跳过，此后**没有任何东西**重触发
  # （本仓库 CI 跑完原来不通知任何人）。所以在这里补一发：
  # needs: deploy-and-purge = 三桶 rclone sync + CF/EdgeOne 双 purge 都成功、
  # master 已对外可见之后才发，那边这一轮生成必然读到新 master；反向赛跑
  # （master 先、索引后）这一发只是 digest 不变的无害空跑，索引落地后
  # sekai-asset-info 侧既有 workflow_call 链照常兜住。
  #
  # 口径（照抄 sekai-asset-info sync_assets_region.yml 的 notify-front）：
  #   · 事件驱动 + 有界重试（3 次、5/10s 退避），**刻意没有 schedule**——站长口径：
  #     事件没到本身就是上游故障，靠轮询盖住只会让故障更晚被发现；
  #   · 日服链路与让路机制零改动：这里只发一个 dispatch，目录 publish 在
  #     sekai-asset-info 侧由它自己的并发组排队，不抢任何人的道；
  #   · job 级 continue-on-error：补触发失败**不许把 master 同步判红**（同步本身
  #     已经成了）——token 缺/过期、GitHub API 抖动都只 warning，到 sekai-asset-info
  #     手动跑一次 publish_costume_catalog 即可补发。
  # ⚠️ 以后加新区服，新 master-db 仓库要照抄这个 job（只改 REGION 一词）。
  notify-catalog:
    needs: deploy-and-purge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Dispatch region_master_updated
        env:
          ASSETINFO_DISPATCH_TOKEN: ${{ secrets.ASSETINFO_DISPATCH_TOKEN }}
          ASSETINFO_REPOSITORY: ${{ vars.ASSETINFO_REPOSITORY || 'kotori8823/sekai-asset-info' }}
          REGION: cn
          SRC_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${ASSETINFO_DISPATCH_TOKEN:-}" ]; then
            echo "::warning::未配置 ASSETINFO_DISPATCH_TOKEN，目录不会自动重生成——到 sekai-asset-info 手动跑 publish_costume_catalog 可补发"
            exit 0
          fi
          payload="$(printf '{"event_type":"region_master_updated","client_payload":{"region":"%s","source":"%s","run_url":"%s"}}' \
            "${REGION}" "${SRC_REPO}" "${RUN_URL}")"
          code=000
          for attempt in 1 2 3; do
            # || echo 000：curl 自身失败（DNS/连接/超时）也要落进重试，不许中断脚本
            code="$(curl -sS --connect-timeout 10 --max-time 60 -o /dev/null -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${ASSETINFO_DISPATCH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${ASSETINFO_REPOSITORY}/dispatches" \
              -d "${payload}" || echo 000)"
            if [ "${code}" = "204" ]; then
              echo "已通知 sekai-asset-info 重生成衣装目录（region=${REGION}）。"
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              wait=$(( attempt * 5 ))
              echo "dispatch 失败：HTTP ${code}（第 ${attempt} 次，${wait}s 后重试）"
              sleep "${wait}"
            fi
          done
          echo "::warning::补触发目录重生成三次全败（最后 HTTP ${code}）——master 已落 CDN 无碍，只是目录晚一步；到 sekai-asset-info 手动跑 publish_costume_catalog 可补发"
          exit 0
